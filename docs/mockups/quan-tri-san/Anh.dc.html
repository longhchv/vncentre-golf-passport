<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Ảnh sân</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#9A5A22}a:hover{color:#7A4518}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FAF6EF; color: #0B0E2E; font-family: 'Be Vietnam Pro', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">
<div style="background: #070A2E; color: #FFFFFF; padding: 12px 16px 14px 8px; display: flex; align-items: center; gap: 4px">
    <a href="Main.dc.html" aria-label="Về danh sách sân" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #FFFFFF"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></a>
    <div style="display: flex; flex-direction: column; gap: 2px; min-width: 0"><span style="font-size: 12px; color: #F5C54E; font-weight: 600">Ảnh · đóng logo tự động</span><h1 style="margin: 0; font-size: 19px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">[Sân nước ngoài – ví dụ]</h1></div>
  </div>
  <div style="flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 14px">
    <a href="#" style="display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 52px; border-radius: 12px; border: 1.5px dashed #B06829; color: #9A5A22; font-weight: 600; text-decoration: none; background: #FFFFFF">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 16V4M6 10l6-6 6 6M4 20h16"></path></svg>
      Chọn ảnh từ điện thoại
    </a>
    <span style="font-size: 12px; color: #5F5B6E">Ảnh tự đóng logo VN Centre, nén nhỏ. Bấm vào ảnh để đặt làm ảnh đại diện trên website.</span>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
      <sc-for list="{{photos}}" as="p" hint-placeholder-count="6">
        <button onClick="{{p.pick}}" aria-pressed="{{p.cover}}" style="{{p.style}}">
          <span style="height: 110px; border-radius: 10px; background: #E9E2D3; display: flex; align-items: center; justify-content: center; color: #5F5B6E; font-size: 12px; position: relative">
            [ảnh {{p.n}}]
            <span style="position: absolute; right: 6px; bottom: 6px; font-size: 10px; font-weight: 700; background: rgba(7,10,46,.8); color: #FFFFFF; padding: 2px 5px; border-radius: 4px">VN Centre</span>
          </span>
          <span style="display: flex; justify-content: space-between; align-items: center; gap: 4px; font-size: 12px">
            <span style="font-weight: 600">{{p.label}}</span>
            <sc-if value="{{p.isCover}}" hint-placeholder-val="{{ false }}"><span style="font-size: 11px; font-weight: 700; color: #FFFFFF; background: #B06829; padding: 2px 6px; border-radius: 6px">Đại diện</span></sc-if>
          </span>
        </button>
      </sc-for>
    </div>
  </div>
  <div style="padding: 10px 16px; border-top: 1px solid #E6DFD2; background: #FAF6EF"><a href="Cam-nhan.dc.html" style="display: flex; align-items: center; justify-content: center; height: 48px; border-radius: 12px; background: #B06829; color: #FFFFFF; font-weight: 600; text-decoration: none">Lưu và sang Cảm nhận</a></div>
<nav aria-label="Các phần của sân" style="display: flex; background: #FFFFFF; border-top: 1px solid #E6DFD2; padding: 4px 4px 10px"><a href="Thong-tin.dc.html" style="flex: 1; min-height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: #5F5B6E; font-size: 11px; font-weight: 500"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"></path></svg>Thông tin</a><a href="Anh.dc.html" style="flex: 1; min-height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: #B06829; font-size: 11px; font-weight: 700"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h3l2-2h6l2 2h3v12H4z M12 17a4 4 0 1 0 0-8 4 4 0 0 0 0 8"></path></svg>Ảnh</a><a href="Cam-nhan.dc.html" style="flex: 1; min-height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: #5F5B6E; font-size: 11px; font-weight: 500"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"></path></svg>Cảm nhận</a><a href="Quanh-san.dc.html" style="flex: 1; min-height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: #5F5B6E; font-size: 11px; font-weight: 500"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z M12 12.5a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5"></path></svg>Quanh sân</a><a href="Xem-truoc.dc.html" style="flex: 1; min-height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: #5F5B6E; font-size: 11px; font-weight: 500"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7"></path></svg>Đăng</a></nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { cover: 0 }; }
  renderVals() {
    const labels = ['Toàn cảnh', 'Hố 1 · từ tee', 'Club house', 'Hoàng hôn', 'Hố 7 · green', 'Nhà hàng trong sân'];
    const photos = labels.map((label, i) => { const on = this.state.cover === i; return { n: i + 1, label, isCover: on, cover: String(on),
      style: `all: unset; cursor: pointer; display: flex; flex-direction: column; gap: 6px; padding: 6px; border-radius: 12px; background: #FFFFFF; border: ${on ? '2px solid #B06829' : '1px solid #E6DFD2'}`,
      pick: () => this.setState({ cover: i }) }; });
    return { photos };
  }
}
</script>
</body>
</html>
