<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Thêm sân</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#9A5A22}a:hover{color:#7A4518}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FAF6EF; color: #0B0E2E; font-family: 'Be Vietnam Pro', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <div style="background: #070A2E; color: #FFFFFF; padding: 16px 16px 16px 8px; display: flex; align-items: center; gap: 4px">
    <a href="Main.dc.html" aria-label="Quay lại danh sách sân" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #FFFFFF">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>
    </a>
    <h1 style="margin: 0; font-size: 20px; font-weight: 700">Thêm sân</h1>
  </div>
  <div style="flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 14px">
    <details style="background: #FFFFFF; border: 1px dashed #B06829; border-radius: 12px; padding: 12px 14px">
      <summary style="cursor: pointer; font-size: 14px; font-weight: 600; color: #9A5A22">Dán thông tin Minh gửi</summary>
      <textarea aria-label="Khối thông tin sân Minh gửi" rows="4" placeholder="Dán nguyên khối thông tin sân vào đây, app tự điền các ô bên dưới" style="width: 100%; box-sizing: border-box; margin-top: 10px; border-radius: 10px; border: 1px solid #E6DFD2; padding: 10px; font: 14px 'Be Vietnam Pro', sans-serif; resize: vertical"></textarea>
    </details>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="n" style="font-size: 13px; font-weight: 600">Tên sân</label>
      <input id="n" placeholder="vd Black Mountain Golf Club" value="" style="height: 48px; border-radius: 12px; border: 1px solid #E6DFD2; padding: 0 14px; font: 16px 'Be Vietnam Pro', sans-serif; background: #FFFFFF">
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="ne" style="font-size: 13px; font-weight: 600">Tên tiếng Anh</label>
      <input id="ne" placeholder="Để trống nếu giống tên trên" value="" style="height: 48px; border-radius: 12px; border: 1px solid #E6DFD2; padding: 0 14px; font: 16px 'Be Vietnam Pro', sans-serif; background: #FFFFFF">
    </div>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
      <div style="display: flex; flex-direction: column; gap: 6px">
        <label for="c" style="font-size: 13px; font-weight: 600">Quốc gia</label>
        <select id="c" style="height: 48px; border-radius: 12px; border: 1px solid #E6DFD2; padding: 0 14px; font: 16px 'Be Vietnam Pro', sans-serif; background: #FFFFFF"><option>Việt Nam (VN)</option><option selected>Thái Lan (TH)</option><option>Nhật Bản (JP)</option><option>Hàn Quốc (KR)</option></select>
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px">
        <label for="r" style="font-size: 13px; font-weight: 600">Tỉnh / vùng</label>
        <input id="r" placeholder="vd Hua Hin" style="height: 48px; border-radius: 12px; border: 1px solid #E6DFD2; padding: 0 14px; font: 16px 'Be Vietnam Pro', sans-serif; background: #FFFFFF">
      </div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="g" style="font-size: 13px; font-weight: 600">Link Google Maps của sân</label>
      <input id="g" placeholder="Dán link, app tự lấy toạ độ" style="height: 48px; border-radius: 12px; border: 1px solid #E6DFD2; padding: 0 14px; font: 16px 'Be Vietnam Pro', sans-serif; background: #FFFFFF">
      <span style="font-size: 12px; color: #5F5B6E">Toạ độ: [tự tách từ link] · hoặc chấm trên bản đồ</span>
    </div>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
      <div style="display: flex; flex-direction: column; gap: 6px"><label for="ph" style="font-size: 13px; font-weight: 600">Điện thoại</label><input id="ph" placeholder="+66 ..." style="height: 48px; border-radius: 12px; border: 1px solid #E6DFD2; padding: 0 14px; font: 16px 'Be Vietnam Pro', sans-serif; background: #FFFFFF"></div>
      <div style="display: flex; flex-direction: column; gap: 6px"><label for="w" style="font-size: 13px; font-weight: 600">Website</label><input id="w" placeholder="https://" style="height: 48px; border-radius: 12px; border: 1px solid #E6DFD2; padding: 0 14px; font: 16px 'Be Vietnam Pro', sans-serif; background: #FFFFFF"></div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 8px">
      <span style="font-size: 13px; font-weight: 600">Loại sân</span>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
        <button onClick="{{kindExp}}" style="{{expStyle}}">VN Centre trải nghiệm</button>
        <button onClick="{{kindRated}}" style="{{ratedStyle}}">Đã đo (nối app CSR)</button>
      </div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="d" style="font-size: 13px; font-weight: 600">Ngày chơi</label>
      <input id="d" type="date" value="2026-10-23" style="height: 48px; border-radius: 12px; border: 1px solid #E6DFD2; padding: 0 14px; font: 16px 'Be Vietnam Pro', sans-serif; background: #FFFFFF">
    </div>
  </div>
  <div style="padding: 12px 16px 20px; border-top: 1px solid #E6DFD2">
    <a href="Thong-tin.dc.html" style="display: flex; align-items: center; justify-content: center; height: 50px; border-radius: 12px; background: #B06829; color: #FFFFFF; font-weight: 600; font-size: 16px; text-decoration: none">Tạo sân và nhập tiếp</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { kind: 'exp' }; }
  renderVals() {
    const seg = on => `min-height: 48px; border-radius: 12px; cursor: pointer; font: 600 13px 'Be Vietnam Pro', sans-serif; border: ${on ? '2px solid #070A2E' : '1px solid #E6DFD2'}; background: ${on ? '#070A2E' : '#FFFFFF'}; color: ${on ? '#FFFFFF' : '#0B0E2E'}`;
    return { expStyle: seg(this.state.kind === 'exp'), ratedStyle: seg(this.state.kind === 'rated'),
      kindExp: () => this.setState({ kind: 'exp' }), kindRated: () => this.setState({ kind: 'rated' }) };
  }
}
</script>
</body>
</html>
