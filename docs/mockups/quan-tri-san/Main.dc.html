<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Danh sách sân</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#9A5A22}a:hover{color:#7A4518}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FAF6EF; color: #0B0E2E; font-family: 'Be Vietnam Pro', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <div style="background: #070A2E; color: #FFFFFF; padding: 20px 20px 18px; display: flex; flex-direction: column; gap: 4px">
    <span style="font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: #F5C54E; font-weight: 600">Golf Passport · Quản trị</span>
    <h1 style="margin: 0; font-size: 26px; font-weight: 700">Sân golf</h1>
    <span style="font-size: 13px; color: #C9C8DA">3 sân · 1 đã đăng</span>
  </div>
  <div style="padding: 14px 16px 8px; display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; gap: 8px; flex-wrap: wrap">
      <sc-for list="{{scopes}}" as="s" hint-placeholder-count="3">
        <button onClick="{{s.pick}}" style="{{s.style}}">{{s.label}}</button>
      </sc-for>
    </div>
  </div>
  <div style="flex: 1; overflow-y: auto; padding: 4px 16px 16px; display: flex; flex-direction: column; gap: 12px">
    <sc-for list="{{rows}}" as="c" hint-placeholder-count="3">
      <a href="Thong-tin.dc.html" style="text-decoration: none; color: #0B0E2E; background: #FFFFFF; border: 1px solid #E6DFD2; border-radius: 14px; padding: 14px 16px; display: flex; flex-direction: column; gap: 6px">
        <span style="display: flex; gap: 6px; flex-wrap: wrap">
          <span style="{{c.kindStyle}}">{{c.kind}}</span>
          <span style="{{c.statusStyle}}">{{c.status}}</span>
          <span style="font-size: 12px; color: #5F5B6E; padding: 3px 0">{{c.flag}}</span>
        </span>
        <span style="font-size: 17px; font-weight: 600">{{c.name}}</span>
        <span style="font-size: 13px; color: #5F5B6E">{{c.meta}}</span>
      </a>
    </sc-for>
  </div>
  <div style="padding: 12px 16px 20px; background: #FAF6EF; border-top: 1px solid #E6DFD2">
    <a href="Them-san.dc.html" style="display: flex; align-items: center; justify-content: center; gap: 8px; height: 50px; border-radius: 12px; background: #B06829; color: #FFFFFF; font-weight: 600; font-size: 16px; text-decoration: none">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
      Thêm sân
    </a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { scope: 'all' }; }
  renderVals() {
    const chip = on => `min-height: 36px; padding: 0 14px; border-radius: 999px; font: 600 13px 'Be Vietnam Pro', sans-serif; cursor: pointer; border: 1px solid ${on ? '#070A2E' : '#E6DFD2'}; background: ${on ? '#070A2E' : '#FFFFFF'}; color: ${on ? '#FFFFFF' : '#0B0E2E'}`;
    const tag = (bg, fg) => `font-size: 12px; font-weight: 600; padding: 3px 8px; border-radius: 6px; background: ${bg}; color: ${fg}`;
    const all = [
      { vn: true, name: 'Mường Thanh Golf Club Xuân Thành', kind: 'Đã đo', status: 'Đã đăng', flag: 'Hà Tĩnh, Việt Nam', meta: '18 hố · 94 địa điểm quanh sân · cập nhật 23/10/2026' },
      { vn: true, name: 'Cửa Lò Golf Resort', kind: 'Đã đo', status: 'Nháp', flag: 'Nghệ An, Việt Nam', meta: '18 hố · 91 gợi ý chờ duyệt' },
      { vn: false, name: '[Sân nước ngoài – ví dụ]', kind: 'VN Centre trải nghiệm', status: 'Nháp', flag: 'Thái Lan', meta: '18 hố · chưa có ảnh, chưa có cảm nhận' },
    ];
    const s = this.state.scope;
    const rows = all.filter(c => s === 'all' || (s === 'vn') === c.vn).map(c => ({ ...c,
      kindStyle: c.kind === 'Đã đo' ? tag('#E8EEF8', '#1F3A6B') : tag('#FBEBDD', '#7A4518'),
      statusStyle: c.status === 'Đã đăng' ? tag('#E3F1E6', '#1E5B2E') : tag('#EFEDE8', '#4A4757') }));
    const scopes = [['all', 'Tất cả'], ['vn', 'Việt Nam'], ['intl', 'Quốc tế']].map(([k, label]) => ({ label, style: chip(s === k), pick: () => this.setState({ scope: k }) }));
    return { rows, scopes };
  }
}
</script>
</body>
</html>
