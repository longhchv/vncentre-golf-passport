<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3a1f0c">
<title>Sân Tập Golf Việt Nam</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Playfair+Display:wght@600;700;800&display=swap">
<style>
/* Two brand palettes (VN Centre brown+gold / Golf Passport navy+gold), each with light + dark */
:root{
  --brand:#3a1f0c; --brand-2:#55290e; --on-brand:#fbf3e6; --accent:#f1ab50; --accent-2:#c57b2f; --on-accent:#2a1607;
  --bg:#faf7f2; --surface:#ffffff; --surface-2:#f4eee5; --ink:#2b2118; --muted:#6f655b; --line:#e7ded1;
  --t-range:#2e7d4f; --t-3d:#2f5fa8; --t-academy:#8a3f8f; --t-course:#b06829; --t-mini:#7a7f87;
  --star:#d08a16; --me:#d9482b;
  --shadow:0 1px 2px rgba(40,25,10,.06),0 6px 20px rgba(40,25,10,.07);
  --serif:"Playfair Display",Georgia,serif; --sans:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:14px;
}
:root[data-brand="passport"]{
  --brand:#080634; --brand-2:#1c1a4f; --on-brand:#f6f2e7; --accent:#f9c74f; --accent-2:#b06829; --on-accent:#1a1608;
  --bg:#fbf7ef; --surface:#ffffff; --surface-2:#f1ede3; --ink:#14123a; --muted:#5d5b78; --line:#e4dfd3;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --brand:#2a1708; --brand-2:#3d220c; --on-brand:#f6ead6; --accent:#f1ab50; --accent-2:#e0a060; --on-accent:#2a1607;
  --bg:#15100b; --surface:#1f1811; --surface-2:#2a2118; --ink:#f3ebe0; --muted:#b5a998; --line:#3a2f23;
  --t-range:#5cc28a; --t-3d:#7aa6ec; --t-academy:#d38ad8; --t-course:#e0a060; --t-mini:#a3a9b2; --star:#f2b84b; --me:#ff7a5c;
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark}
 :root[data-brand="passport"]:not([data-theme="light"]){
  --brand:#080634; --brand-2:#14123f; --on-brand:#f6f2e7; --accent:#f9c74f; --accent-2:#e3a45c; --on-accent:#1a1608;
  --bg:#0b0a1c; --surface:#141331; --surface-2:#1d1b42; --ink:#eeecf8; --muted:#a6a4c4; --line:#2c2a55;}}
:root[data-theme="dark"]{
  --brand:#2a1708; --brand-2:#3d220c; --on-brand:#f6ead6; --accent:#f1ab50; --accent-2:#e0a060; --on-accent:#2a1607;
  --bg:#15100b; --surface:#1f1811; --surface-2:#2a2118; --ink:#f3ebe0; --muted:#b5a998; --line:#3a2f23;
  --t-range:#5cc28a; --t-3d:#7aa6ec; --t-academy:#d38ad8; --t-course:#e0a060; --t-mini:#a3a9b2; --star:#f2b84b; --me:#ff7a5c;
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark}
:root[data-theme="dark"][data-brand="passport"]{
  --brand:#080634; --brand-2:#14123f; --bg:#0b0a1c; --surface:#141331; --surface-2:#1d1b42; --ink:#eeecf8; --muted:#a6a4c4; --line:#2c2a55; --accent:#f9c74f;}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1360px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* Brand bar */
.top{background:var(--brand);color:var(--on-brand);padding-top:env(safe-area-inset-top,0px)}
.top .wrap{display:flex;align-items:center;gap:12px;min-height:60px}.toplink{display:inline-flex;align-items:center;min-height:40px;padding:0 12px;border-radius:999px;border:1px solid color-mix(in srgb,currentColor 30%,transparent);color:inherit;font-weight:700;font-size:13px;text-decoration:none;white-space:nowrap}.toplink:hover{background:color-mix(in srgb,currentColor 10%,transparent)}@media(max-width:440px){header.top .logo small{display:none!important}.logo b{white-space:nowrap}.toplink{padding:0 10px;font-size:12px}.tl-full{display:none}.tl-short{display:inline!important}.top .seg,.toplink{flex-shrink:0}.logo span{min-width:0;overflow:hidden}header.top .logo b{display:block;overflow:hidden;text-overflow:ellipsis;font-size:14px;letter-spacing:0}header.top .wrap{gap:6px}header.top .logo{gap:6px}.logo svg{width:32px;height:32px;flex-shrink:0}}.tl-short{display:none}.crsnear{display:grid;gap:8px;margin-top:10px}.crsnear a{display:flex;justify-content:space-between;gap:10px;align-items:center;min-height:52px;padding:8px 12px;border:1px solid var(--line);border-radius:12px;text-decoration:none;color:var(--ink);background:var(--surface)}.crsnear small{color:var(--muted)}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;min-width:0}
.logo svg{flex:none}
.logo b{font-family:var(--serif);font-size:18px;letter-spacing:.02em;display:block;line-height:1.1}
.logo small{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;opacity:.75}
.top .sp{flex:1}
.seg{display:inline-flex;border:1px solid color-mix(in srgb,var(--on-brand) 30%,transparent);border-radius:999px;overflow:hidden}
.seg button{background:none;border:0;padding:6px 11px;font-size:12px;font-weight:600;cursor:pointer;color:var(--on-brand);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.swatch{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px;border:1px solid rgba(255,255,255,.5)}

/* Hero */
.hero{background:linear-gradient(180deg,var(--brand) 0,var(--brand-2) 100%);color:var(--on-brand);padding:22px 0 26px}
.hero h1{font-family:var(--serif);font-weight:700;font-size:clamp(26px,4.2vw,40px);line-height:1.15;margin:0 0 6px;text-wrap:balance}
.hero h1 em{font-style:normal;color:var(--accent)}
.hero p.lead{margin:0 0 16px;opacity:.85;max-width:62ch}
.regions{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px;scrollbar-width:none}
.regions::-webkit-scrollbar{display:none}
.region{flex:none;border:1px solid color-mix(in srgb,var(--on-brand) 30%,transparent);background:transparent;color:var(--on-brand);border-radius:999px;padding:7px 14px;font-weight:600;font-size:14px;cursor:pointer;white-space:nowrap}
.region span{opacity:.7;font-weight:500;margin-left:4px;font-size:12px}
.region[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.finder{background:var(--surface);color:var(--ink);border-radius:18px;padding:12px;box-shadow:0 10px 30px rgba(0,0,0,.18);display:grid;gap:10px}
.searchbox{display:flex;align-items:center;gap:8px;background:var(--surface-2);border-radius:12px;padding:0 12px;height:48px}
.searchbox input{flex:1;min-width:0;border:0;background:transparent;font-size:16px;outline:none}
.searchbox svg{flex:none;opacity:.6}
.locrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:40px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600;font-size:14px;white-space:nowrap;text-decoration:none;color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.dark{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.btn.sm{height:34px;padding:0 11px;font-size:13px;border-radius:9px}
.locrow select{height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);padding:0 10px;min-width:0;flex:1 1 180px;max-width:100%}
@media (min-width:900px){.finder{grid-template-columns:minmax(0,1fr) auto;align-items:center}.finder .searchbox,.finder .where{grid-column:1/-1}}
.radius{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.radius .lbl{font-size:13px;color:var(--muted);margin-right:2px}
.pill{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;cursor:pointer;font-weight:500;white-space:nowrap}
.pill[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.where{font-size:13px;color:var(--muted)}
.where b{color:var(--ink)}

/* Toolbar */
.toolbar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.toolbar .wrap{display:flex;align-items:center;gap:8px;padding-top:10px;padding-bottom:10px}
.brandrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:14px;font-weight:700}.brandrow select{flex:1;min-width:200px;font:inherit;font-weight:600;padding:9px 12px;border-radius:10px;border:1px solid #cfc6b8;background:#fff;color:#111}.brandrow select option{background:#fff;color:#111}.elsewhere{margin-top:12px;display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.mchips .pill:not([aria-pressed="true"]){background:#fff;color:#111;border-color:#cfc6b8}
.types{display:flex;gap:6px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:none}
.types::-webkit-scrollbar{display:none}
.tchip{flex:none;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
.tchip i{width:9px;height:9px;border-radius:50%;display:inline-block}
.tchip small{color:var(--muted);font-weight:500}
.tchip[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--surface)}
.tchip[aria-pressed="true"] small{color:inherit;opacity:.75}
.fbtn{position:relative}
.fbtn .n[hidden]{display:none}
.fbtn .n{position:absolute;top:-6px;right:-6px;min-width:18px;height:18px;border-radius:9px;background:var(--me);color:#fff;font-size:11px;display:grid;place-items:center;padding:0 4px}
.viewtog{display:none}
.actives{display:flex;flex-wrap:wrap;gap:6px;padding-top:10px}
.actives:empty{display:none}
.actives button{border:0;background:var(--surface-2);border-radius:999px;padding:4px 10px;font-size:12.5px;cursor:pointer}
.actives button::after{content:" ✕";opacity:.6}

/* Layout */
main.grid{display:grid;grid-template-columns:260px minmax(0,1fr) minmax(0,1fr);gap:18px;padding-top:16px;padding-bottom:24px;align-items:start}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
aside.filters{padding:16px;position:sticky;top:76px;max-height:calc(100vh - 92px);overflow:auto;display:flex;flex-direction:column;gap:18px}
.fg h3{font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:0 0 8px;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.fg select{width:100%;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);padding:0 10px}
.drawer-head,.drawer-foot{display:none}
.results{min-width:0}
.rhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.rhead h2{font-family:var(--serif);font-size:22px;margin:0}
.rhead select{height:36px;border-radius:10px;border:1px solid var(--line);background:var(--surface);padding:0 8px}
.list{display:grid;gap:12px}
.card{padding:16px;display:grid;gap:8px;cursor:pointer;transition:border-color .15s,box-shadow .15s;position:relative}
.card:hover{box-shadow:var(--shadow)}
.card.sel{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 35%,transparent)}
.crow{display:flex;justify-content:space-between;align-items:center;gap:8px}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;letter-spacing:.02em;padding:3px 9px;border-radius:999px;background:color-mix(in srgb,var(--c) 14%,transparent);color:var(--c)}
.badge i{width:7px;height:7px;border-radius:50%;background:var(--c)}
.dist{font-weight:700;font-size:13px;background:var(--surface-2);border-radius:999px;padding:3px 10px;white-space:nowrap;font-variant-numeric:tabular-nums}
.card h3{margin:0;font-size:17px;line-height:1.3;font-weight:700;overflow-wrap:anywhere}
.meta{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:13px;color:var(--muted)}
.meta .stars{color:var(--star);font-weight:700}
.meta .warn{color:var(--me);font-weight:600}
.addr{font-size:14px;overflow-wrap:anywhere}
.svc{display:flex;flex-wrap:wrap;gap:5px}
.svc span{font-size:12px;background:var(--surface-2);border-radius:6px;padding:2px 8px}
.todo{font-size:12px;color:var(--muted)}
.acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.phone{font-variant-numeric:tabular-nums}
.mapbox{position:sticky;top:76px;padding:10px;display:flex;flex-direction:column;gap:8px}
.mapbox>svg[hidden],#lmap[hidden]{display:none!important}.mapbox>svg{width:100%;height:auto;max-height:calc(100vh - 190px);display:block;border-radius:10px;background:var(--surface-2);touch-action:manipulation;cursor:crosshair}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:8px;height:8px;border-radius:50%;display:inline-block}
.hint{font-size:12px;color:var(--muted)}
.empty{padding:32px 20px;text-align:center;color:var(--muted)}
.more{display:flex;justify-content:center;margin-top:12px}
footer{border-top:1px solid var(--line);padding:22px 0 36px;color:var(--muted);font-size:13px}
footer .wrap{display:grid;gap:8px}
footer b{color:var(--ink);font-family:var(--serif);font-size:16px}
/* Detail page */
body.detail .hero,body.detail .toolbar,body.detail main.grid{display:none}
#detail{padding-bottom:28px}
.dback{display:flex;align-items:center;gap:10px;padding:14px 0;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.dback .btn{height:36px}
.dhero{background:linear-gradient(135deg,var(--brand) 0,var(--brand-2) 100%);color:var(--on-brand);border-radius:20px;padding:22px;display:grid;gap:12px;position:relative;overflow:hidden}
.dhero::after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;border:28px solid color-mix(in srgb,var(--accent) 22%,transparent)}
.dhero h1{font-family:var(--serif);font-size:clamp(26px,4vw,38px);line-height:1.15;margin:0;position:relative;z-index:1;overflow-wrap:anywhere}
.dhero .badges{display:flex;flex-wrap:wrap;gap:6px;position:relative;z-index:1}
.dhero .badges span{font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;background:color-mix(in srgb,var(--on-brand) 14%,transparent)}
.dhero .badges .gold{background:var(--accent);color:var(--on-accent)}
.dhero .line{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:14px;opacity:.92;position:relative;z-index:1}
.dhero .line .stars{color:var(--accent);font-weight:700}
.dhero .acts{position:relative;z-index:1}
.dhero .btn:not(.primary){background:color-mix(in srgb,var(--on-brand) 10%,transparent);border-color:color-mix(in srgb,var(--on-brand) 25%,transparent);color:var(--on-brand)}
.dhero .btn[disabled]{opacity:.65;cursor:not-allowed}
.dnav{position:sticky;top:0;z-index:15;background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:blur(8px);display:flex;gap:6px;overflow-x:auto;padding:10px 0;margin:6px 0 4px;scrollbar-width:none;border-bottom:1px solid var(--line)}
.dnav::-webkit-scrollbar{display:none}
.dnav a{flex:none;text-decoration:none;font-size:13px;font-weight:600;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface)}
.dgrid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:18px;align-items:start;margin-top:14px}
.dsec{padding:20px;scroll-margin-top:64px}
.dsec+.dsec{margin-top:14px}
.dsec h2{font-family:var(--serif);font-size:22px;margin:0 0 4px}
.dsec .sub{color:var(--muted);font-size:13px;margin:0 0 14px}
.dsec p{margin:0 0 10px}
.pending{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--accent-2);background:color-mix(in srgb,var(--accent) 16%,transparent);border-radius:999px;padding:3px 10px;margin-bottom:12px}
table.price{width:100%;border-collapse:collapse;font-size:14px}
table.price th,table.price td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top}
table.price th{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
table.price td.v{color:var(--muted);white-space:nowrap}
.svcgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.svcgrid div{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:10px;background:var(--surface-2);font-size:14px}
.svcgrid div.off{opacity:.45}
.svcgrid b{font-size:18px;width:24px;text-align:center}
.gallery a{display:block;aspect-ratio:4/3;border-radius:12px;overflow:hidden;background:var(--surface-2)}.gallery a img{width:100%;height:100%;object-fit:cover;display:block}.contrib{padding:16px}.contrib h3{font-family:var(--serif);font-size:18px;margin:0}.contrib .cb{display:grid;gap:8px}.contrib .cb a{display:flex;align-items:center;justify-content:center;min-height:44px;border-radius:12px;font-weight:700;font-size:14px;text-decoration:none;border:1px solid var(--line);color:var(--ink);background:var(--surface)}.contrib .cb a.pri{background:var(--accent);color:#2b1a08;border-color:transparent}.contrib p{font-size:13px;color:var(--muted);margin:4px 0 10px}.vncb{font-weight:800;color:#2b1a08;background:var(--accent);padding:0 7px;border-radius:6px}.rh{font-family:var(--serif);font-size:18px;margin:6px 0 0}.urs{font-family:var(--sans,inherit);font-size:14px;font-weight:700;color:var(--muted)}.vncbox{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center;margin-top:8px}.vncbig{display:flex;align-items:baseline;gap:2px;padding:14px 18px;border-radius:16px;background:var(--accent);color:#2b1a08}.vncbig b{font-size:40px;line-height:1}.vncbig span{font-weight:700}.vncbars{display:grid;gap:6px}.vncbars div{display:grid;grid-template-columns:minmax(0,9.5em) 1fr 2em;gap:8px;align-items:center;font-size:13px}.vncbars i{display:block;height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}.vncbars em{display:block;height:100%;background:var(--accent)}.vncbars b{text-align:right}.vnote{font-size:14px;margin:8px 0 0}.ulist{display:grid;gap:10px;margin-top:8px}.urev{border-top:1px solid var(--line);padding-top:10px}.urev p{margin:0 0 4px;font-size:14px}.urev small{color:var(--muted)}.orep{background:var(--surface-2);border-radius:10px;padding:8px 10px}@media(max-width:520px){.vncbox{grid-template-columns:1fr}.vncbig{justify-self:start}}.ownb{display:inline-block;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:color-mix(in srgb,var(--accent) 22%,transparent)}
.gallery{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.gallery div{aspect-ratio:4/3;border-radius:12px;background:linear-gradient(135deg,var(--surface-2),color-mix(in srgb,var(--accent) 18%,var(--surface-2)));display:grid;place-items:center;text-align:center;font-size:12px;color:var(--muted);padding:8px}
.gallery div b{display:block;font-size:22px;margin-bottom:4px;color:var(--ink);opacity:.6}
.gallery div:first-child{grid-column:span 2;grid-row:span 2;aspect-ratio:auto}
.spec{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px}
.spec div{border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.spec small{display:block;color:var(--muted);font-size:12px}
.spec b{font-size:14px}
.articles{display:grid;gap:8px}
.articles a{display:flex;justify-content:space-between;gap:10px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;text-decoration:none;font-weight:600;font-size:14px}
.articles a span{color:var(--muted);font-weight:500;font-size:12px}
.tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.near{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}

/* Giá thấp nhất ngày thường (máy theo giờ, rồi rổ bóng) để hiện "từ …" */
function priceFrom(p){
  const s=(p.sims||[]).filter(r=>r.weekday!=null).sort((a,b)=>a.weekday-b.weekday)[0];
  if(s)return {v:s.weekday,u:s.unit==="hour_person"?t("perHP"):s.unit==="round"?t("perRound"):s.unit==="hour_room"||!s.unit?t("perH"):""};
  const r=(p.ranges||[]).filter(r=>r.weekday!=null&&(r.kind==="balls"||r.kind==="hour"||r.kind==="unlimited")).sort((a,b)=>a.weekday-b.weekday)[0];
  if(r)return {v:r.weekday,u:r.kind==="balls"&&r.balls?t("perBalls").replace("{b}",r.balls):r.kind==="hour"?t("perH"):""};
  return null;
}
function icons(p){
  const o=[];
  if(p.shop&&(p.shop.apparel||p.shop.accessories||p.shop.clubs||p.shop.fitting))o.push(["🛍",t("ico.shop")]);
  if(p.academy&&p.academy.has&&p.type!=="academy")o.push(["🎓",t("ico.academy")]);
  if(p.kids&&(p.kids.junior_clubs||p.kids.junior_class))o.push(["👪",t("ico.kids")]);
  if(p.rental&&p.rental.available)o.push(["🏌",t("ico.rental")]);
  if(p.fac&&p.fac.vip_room)o.push(["★",t("ico.vip")]);
  if((p.langs||[]).length)o.push(["🌐",(p.langs||[]).map(x=>x.toUpperCase()).join(" · ")]);

}

const NEEDS=["kids","noon","early","after_work","group","foreigners","beginner"];
function needScore(p,n){
  if(!n)return 0;const f=p.fit||[],q=(p.busy&&p.busy.quiet)||[],k=p.kids||{};let s=0;
  if(n==="kids"){s+=f.includes("kids_mall")?3:0;s+=k.junior_clubs?2:0;s+=k.junior_class?2:0;s+=(p.svc||[]).includes("kids")?1:0;s+=p.type==="mini"?1:0}
  if(n==="noon"){s+=f.includes("noon")?3:0;s+=q.includes("noon")?2:0}
  if(n==="early"){s+=f.includes("early")?3:0;s+=q.includes("early")||q.includes("morning")?2:0;s+=p.hours==="24h"?1:0}
  if(n==="after_work"){s+=f.includes("after_work")?3:0;s+=p.late?2:0;s+=q.includes("evening")||q.includes("late")?1:0}
  if(n==="group"){s+=f.includes("group")?3:0;s+=p.fac&&p.fac.vip_room?2:0;s+=(p.bays||0)>=4?1:0;s+=(p.svc||[]).includes("food")?1:0}
  if(n==="foreigners"){s+=f.includes("foreigners")?3:0;s+=(p.langs||[]).length*1.5}
  if(n==="beginner"){s+=p.rental&&p.rental.available?3:0;s+=(p.academy&&p.academy.has)||p.type==="academy"?2:0;s+=(p.svc||[]).includes("class")?1:0}
  return s;
}
const needMatch=p=>st.need?needScore(p,st.need)>=2:false;

}

/* ---- "Quanh đây": 5 nhóm, dữ liệu OpenStreetMap (Overpass), kèm tìm thêm trên Google Maps ---- */
const AR_GROUPS=["kids","beauty","shop","cafe","elder"];
/* Chừa chỗ nối web Cafe Review: khi có nguồn dữ liệu (URL trả về [{name,lat,lng,url,note}]) thì điền vào đây; quán của VN Centre hiện lên đầu nhóm "Cà phê chờ" */
const CAFE_REVIEW={url:"",label:"Cafe Review by VN Centre"};
const AR_R=1500;
const AROUND_CACHE={};let arGroup="kids";
function arClassify(tg){
  const L=tg.leisure,A=tg.amenity,S=tg.shop;
  if(L==="playground")return ["kids","playground"];if(L==="amusement_arcade"||L==="adult_gaming_centre"&&false)return ["kids","arcade"];
  if(L==="water_park")return ["kids","water_park"];if(tg.tourism==="theme_park")return ["kids","amusement"];if(tg.tourism==="zoo")return ["kids","zoo"];
  if(A==="library")return ["kids","library"];if(S==="books")return ["kids","books"];if(A==="cinema")return ["kids","cinema"];
  if(S==="beauty")return ["beauty",tg.beauty==="nails"?"nail":"beauty"];if(S==="hairdresser")return ["beauty","hairdresser"];if(S==="massage")return ["beauty","massage"];
  if(L==="sauna"||A==="spa"||tg.leisure==="spa")return ["beauty",L==="sauna"?"sauna":"spa"];
  if(S==="mall")return ["shop","mall"];if(S==="supermarket")return ["shop","supermarket"];if(S==="department_store")return ["shop","department_store"];
  if(A==="cafe")return [/tea/i.test(tg.cuisine||"")?"elder":"cafe",/tea/i.test(tg.cuisine||"")?"tea":"cafe"];if(S==="tea")return ["elder","tea"];
  if(A==="place_of_worship"&&/buddhist|taoist|folk/i.test(tg.religion||"buddhist"))return ["elder","worship"];
  if(L==="park")return ["park","park"];if(L==="garden")return ["elder","garden"];
  return null;
}
/* Nguồn 1: around.json tính sẵn cho mọi địa điểm (đưa lên cùng trang); nguồn 2: hỏi trực tiếp Overpass (mirror nhanh trước) cho địa điểm mới */
let AROUND_FILE=null;
const aroundFile=()=>AROUND_FILE||(AROUND_FILE=fetch("around.json",{cache:"no-cache"}).then(r=>r.ok?r.json():{}).catch(()=>({})));
const OVERPASS=["https://maps.mail.ru/osm/tools/overpass/api/interpreter","https://overpass-api.de/api/interpreter"];
function arFromFile(p,f){const v=f&&f.v&&f.v[p.id];if(!v)return null;const out={};
  for(const g of AR_GROUPS)out[g]=(v[g]||[]).map(([n,k,la,lo,en])=>({n:lang!=="vi"&&en?en:n,k,lat:la,lng:lo,d:km(p,{lat:la,lng:lo})}));return out}
async function overpassFetch(q){let last;for(const u of OVERPASS){try{const c=new AbortController();const tm=setTimeout(()=>c.abort(),20000);
  const r=await fetch(u,{method:"POST",body:"data="+encodeURIComponent(q),headers:{"Content-Type":"application/x-www-form-urlencoded"},signal:c.signal});clearTimeout(tm);
  if(r.ok)return await r.json();last=new Error(r.status)}catch(e){last=e}}throw last||new Error("overpass")}
async function loadAround(p){
  if(AROUND_CACHE[p.id])return AROUND_CACHE[p.id];
  const f=await aroundFile();const fromFile=arFromFile(p,f);if(fromFile)return AROUND_CACHE[p.id]=fromFile;
  try{const c=sessionStorage.getItem("ar2:"+p.id);if(c)return AROUND_CACHE[p.id]=JSON.parse(c)}catch(e){}
  const a=`(around:${AR_R},${p.lat},${p.lng})`;
  const q=`[out:json][timeout:20];(nwr["leisure"~"^(playground|amusement_arcade|water_park|park|garden|sauna)$"]${a};nwr["tourism"~"^(theme_park|zoo)$"]${a};nwr["amenity"~"^(library|cinema|cafe|place_of_worship|spa)$"]${a};nwr["shop"~"^(books|beauty|hairdresser|massage|mall|supermarket|department_store|tea)$"]${a};);out center tags 400;`;
  const j=await overpassFetch(q);
  const out={kids:[],beauty:[],shop:[],cafe:[],elder:[]};
  for(const e of j.elements||[]){const tg=e.tags||{};const nm=(lang!=="vi"&&tg["name:en"])||tg.name;if(!nm)continue;const c=arClassify(tg);if(!c)continue;
    const la=e.lat??(e.center&&e.center.lat),lo=e.lon??(e.center&&e.center.lon);if(la==null)continue;const it={n:nm,k:c[1],lat:la,lng:lo,d:km(p,{lat:la,lng:lo})};
    if(c[0]==="park"){out.kids.push(it);out.elder.push(it)}else out[c[0]].push(it)}
  for(const g in out){const seen=new Set();out[g]=out[g].sort((a,b)=>a.d-b.d).filter(x=>{const key=x.n.toLowerCase();if(seen.has(key))return false;seen.add(key);return true}).slice(0,8)}
  AROUND_CACHE[p.id]=out;try{sessionStorage.setItem("ar2:"+p.id,JSON.stringify(out))}catch(e){}return out;
}
function aroundHtml(p){
  return `<p class="sub">${t("arSub").replace("{r}",fmtD(AR_R/1000))}</p>
   <div class="tabs artabs" role="tablist">${AR_GROUPS.map(g=>`<button class="pill${g===arGroup?" on":""}" role="tab" aria-selected="${g===arGroup}" data-ar="${g}">${t("ar."+g)}</button>`).join("")}</div>
   <div id="arbox" class="arbox"><span class="pending">● ${t("arLoading")}</span></div>`;
}
function fillAround(p){
  const box=$("arbox");if(!box)return;
  const gq=q=>`https://www.google.com/maps/search/${encodeURIComponent(q)}/@${p.lat},${p.lng},15z`;
