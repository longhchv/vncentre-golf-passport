<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#080634" />
    <script>
      // Giao diện màu (src/lib/theme.ts): mặc định màu Golf Passport, đặt trước khi tải app để không nháy màu
      try { var t = localStorage.getItem('gp-theme') === 'vnc' ? 'vnc' : 'passport' } catch (e) { var t = 'passport' }
      document.documentElement.dataset.theme = t
      if (t === 'vnc') document.querySelector('meta[name="theme-color"]').setAttribute('content', '#3a1f0c')
    </script>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Golf Passport" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/pwa-64x64.png" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <title>VN Centre Golf Passport</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
